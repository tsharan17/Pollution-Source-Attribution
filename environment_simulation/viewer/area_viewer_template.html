<meta charset="utf-8">
<title>PolSo Array Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 3D scene fills the window; every panel lives in one CSS grid shell
   (header / case bar / main area / tour row / timeline), so panels can never cover each other.
   Each view (map, devices, STM32, build) owns the main area. Single deliberate light look. */
:root{
  color-scheme: light;
  --ground:#dfe3df; --paper:#f6f7f4; --paper-2:#eceee9; --ink:#1d2321; --ink-2:#56605b; --ink-3:#8b948f;
  --line:#cfd4cf; --accent:#2f5d50;
  --good:#2e8540; --bad:#c62f2f; --neutral:#b4b3ad; --off:#55544f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.45 var(--body);overflow:hidden}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:600 20px var(--display);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}

/* ---- shell ---- */
.shell{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.shell>*{pointer-events:auto;min-width:0}
.panel{background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 6px 24px rgba(30,40,35,.10)}
.main{position:relative;min-height:0;pointer-events:none}
.main>*{pointer-events:auto}

/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px}
.hdr h1{font:700 24px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase;white-space:nowrap}
.hdr h1 span{color:var(--ink-3);font-weight:500}
.views{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.views button{font:600 12px/1 var(--body);padding:8px 13px;border:0;border-right:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer}
.views button:last-child{border-right:0}
.views button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.actions{display:flex;gap:6px}
.wx{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font:600 24px/1 var(--display);font-variant-numeric:tabular-nums}
#compass{width:38px;height:38px}
.wxv{display:flex;flex-direction:column;gap:1px}
.lbl{font:500 10.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.val{font:500 12px/1.3 var(--mono);font-variant-numeric:tabular-nums}

/* case bar */
.casebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 10px}
#cases{display:flex;flex-wrap:wrap;gap:5px}
#cases button{font:600 12px/1 var(--body);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer}
#cases button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#blurb{margin:0;color:var(--ink-2);font-size:12.5px;flex:1 1 240px;min-width:0}

.btn{font:600 12px/1 var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:64px}
.btn:disabled{opacity:.45;cursor:default}
select{font:500 12px var(--body);padding:7px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
#cases button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- map view ---- */
.legend{position:absolute;left:0;bottom:0;padding:10px 12px;display:grid;gap:5px;max-width:240px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.legend .note{font-size:11px;color:var(--ink-3)}
.sw{width:11px;height:11px;border-radius:50%;flex:none}
.side{position:absolute;right:0;top:0;bottom:0;width:300px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.side>*{pointer-events:auto}
.stats{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.stats b{display:block;font:600 21px/1 var(--display);font-variant-numeric:tabular-nums}
#panel{padding:14px;overflow:auto;min-height:0;flex:0 1 auto}
#panel h2{font:700 22px/1 var(--display);margin:0;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.x{font:500 20px/1 var(--body);border:0;background:none;cursor:pointer;color:var(--ink-2);padding:2px 6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--paper-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body)}
.bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ink)}

#hist{width:100%;height:46px;margin-top:6px}
.fault{color:var(--bad);font-weight:600}
.src{color:var(--ink-2);font-size:12px}
.openDev{margin-top:10px;width:100%}
.tag{position:absolute;z-index:1;pointer-events:none;transform:translate(-50%,-100%);font:600 11px/1 var(--mono);color:var(--ink);
  background:color-mix(in srgb,var(--paper) 85%,transparent);border:1px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap}
.tag.src-tag{font:500 10.5px/1 var(--body);color:var(--ink-2);background:none;border:0;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper)}
.tag .ok{color:var(--good)} .tag .no{color:var(--bad)}
#tip{position:fixed;z-index:30;pointer-events:none;padding:8px 10px;font-size:12px;max-width:260px}

/* which view owns the screen */
body:not([data-view="map"]) #legend, body:not([data-view="map"]) #mapSide,
body:not([data-view="map"]) .tag:not(.mcu-tag){display:none!important}
body:not([data-view="mcu"]) .mcu-tag{display:none!important}
body[data-view="dev"] #stage, body[data-view="build"] #stage{visibility:hidden}
body[data-view="dev"], body[data-view="build"]{background:var(--paper-2)}

/* ---- devices view ---- */
#devView{position:absolute;inset:0;display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px}
#devTabs{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:3px}
#devTabs button{display:grid;grid-template-columns:12px 38px 1fr auto;gap:8px;align-items:center;text-align:left;
  font:500 12px/1.2 var(--body);padding:8px 9px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ink);cursor:pointer}
#devTabs button b{font:600 13px var(--mono)}
#devTabs button span.l{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#devTabs button[aria-selected="true"]{background:var(--paper);border-color:var(--line);box-shadow:0 1px 3px rgba(30,40,35,.08)}
#devTabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#devDetail{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.dh h2{font:700 30px/1 var(--display);margin:0;text-transform:uppercase}
.dh .src{flex:1}
.badge{font:600 11px/1 var(--body);padding:4px 8px;border-radius:99px;border:1.5px solid currentColor}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kp div{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.kp b{display:block;font:600 24px/1 var(--display);font-variant-numeric:tabular-nums}
.nowrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:10px 12px 8px;margin:0;min-width:0}
.chart figcaption{display:flex;justify-content:space-between;gap:10px;font:600 12px var(--body);margin-bottom:4px;flex-wrap:wrap}
.chart figcaption span{font:400 12px var(--mono);color:var(--ink-2)}
.chart canvas{width:100%;display:block;cursor:crosshair}
.ck{display:flex;gap:12px;font-size:11px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.ck i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px}
#miniMap{width:100%;max-width:220px;height:auto;cursor:default}

/* ---- STM32 view ---- */
#mcuView{position:absolute;right:0;top:0;bottom:0;width:400px;display:flex;flex-direction:column;gap:8px}
#mcuBar{padding:8px 11px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--ink-2);flex:none}
#mcuBar label{display:flex;gap:6px;align-items:center}
#mcuPanel{flex:1;overflow:auto;padding:4px 14px 12px;min-height:0}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px;flex-wrap:wrap}
.mh b{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.03em}
.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin:6px 0}
.mg b{display:block;font:600 16px var(--display);font-variant-numeric:tabular-nums}
.mg span{font-size:10.5px;color:var(--ink-3)}
.mb{display:grid;grid-template-columns:96px 1fr 58px;gap:6px;align-items:center;font-size:11px;margin:2px 0}
.mbn{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt{height:7px;background:var(--paper-2);border-radius:4px;overflow:hidden}.mbt i{display:block;height:100%;border-radius:4px}
.mbv{font:500 11px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 8px;font-size:10px;color:var(--ink-3)}
.feat span{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}.feat b{font:500 10px var(--mono);color:var(--ink)}
#mcuPanel canvas{width:100%;display:block;margin-top:6px;border-radius:4px}
.t-SIM,.t-MODEL,.t-EST,.t-DOC,.t-PROP{font:700 9px var(--body);letter-spacing:.05em;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:1px;cursor:help;white-space:nowrap}
.t-SIM{background:#dcefe5;color:#17643f}.t-MODEL{background:#dde7f6;color:#1c4f8f}.t-EST{background:#fbead1;color:#8a5200}
.t-DOC{background:#e6e3f5;color:#3d2f86}.t-PROP{background:#f4dede;color:#8f2525}
.foot{font-size:11px;color:var(--ink-3);margin-top:12px}

/* ---- build view ---- */
#buildView{position:absolute;inset:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px}
#buildNav{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
#buildNav a{display:block;padding:7px 9px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
#buildNav a:hover,#buildNav a:focus-visible{background:var(--paper-2);outline:none}
#buildDoc{overflow:auto;padding:16px 22px 28px;min-width:0}
#buildDoc h2{font:700 24px var(--display);text-transform:uppercase;margin:22px 0 6px;scroll-margin-top:10px}
#buildDoc h2:first-child{margin-top:0}
#buildDoc h3{font:700 16px var(--display);text-transform:uppercase;margin:14px 0 4px}
#buildDoc p{max-width:80ch;margin:4px 0 8px}
#buildDoc table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 10px}
#buildDoc td,#buildDoc th{padding:6px 8px;border-bottom:1px solid var(--paper-2);text-align:left;vertical-align:top}
#buildDoc th{font-weight:600;color:var(--ink-2);font-size:11.5px;background:var(--paper)}
#buildDoc code{font:500 12px var(--mono);background:var(--paper-2);padding:1px 4px;border-radius:3px}
#buildDoc ol{max-width:90ch;padding-left:22px}#buildDoc li{margin-bottom:4px}
.copyrow{display:flex;gap:8px;align-items:center;margin:4px 0 6px}
.scroll{overflow-x:auto}

/* ---- tour, footer, about ---- */
#tour{justify-self:center;max-width:720px;width:100%;padding:12px 16px}
#tour h3{font:700 18px var(--display);text-transform:uppercase;margin:0 0 4px}#tour p{margin:0 0 10px;font-size:14px}
#tour .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timeline{display:flex;gap:10px;align-items:center;padding:9px 12px;flex-wrap:wrap}
.timeline label.btn{display:flex;gap:6px;align-items:center}
.track{flex:1 1 260px;min-width:0;position:relative;height:46px}
#strip{position:absolute;left:0;right:0;top:0;height:28px;width:100%;border-radius:4px;cursor:pointer}
#scrub{position:absolute;left:0;right:0;bottom:0;width:100%;margin:0;accent-color:var(--ink)}
.tl-key{display:flex;gap:10px;color:var(--ink-3);font-size:11px;flex-wrap:wrap;max-width:180px}
.tl-key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#about{position:fixed;inset:0;background:rgba(20,26,24,.45);display:grid;place-items:center;z-index:40;padding:16px}
#about .box{background:var(--paper);border-radius:10px;max-width:900px;width:100%;max-height:86vh;overflow:auto;padding:18px 22px;font-size:13.5px}
#about h2{font:700 24px var(--display);text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between}
#about h3{font:700 16px var(--display);text-transform:uppercase;margin:16px 0 6px}
#about table{width:100%;border-collapse:collapse;font-size:12.5px}#about td,#about th{padding:6px 8px;border-bottom:1px solid var(--paper-2);text-align:left;vertical-align:top}
#about th{font-weight:600;color:var(--ink-2);font-size:11.5px}#about td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
ul.tight{margin:4px 0 8px;padding-left:20px}ul.tight li{margin-bottom:3px}

/* ---- narrow screens: panels become bottom sheets inside the main area ---- */
@media (max-width:900px){
  .shell{gap:6px;padding-left:10px;padding-right:10px}
  .hdr{gap:6px 10px}.hdr h1{font-size:20px}
  .wx{margin-left:0}
  .legend{display:none}
  .side{left:0;width:auto;top:auto;max-height:55%}
  .stats{grid-template-columns:repeat(4,1fr)}.stats b{font-size:17px}
  #mcuView{left:0;width:auto;top:auto;height:58%}
  #devView,#buildView{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #devTabs,#buildNav{flex-direction:row;overflow-x:auto}
  #devTabs button{grid-template-columns:12px auto auto}
  #devTabs button span.l{display:none}
  #buildNav a{white-space:nowrap}
  .two{grid-template-columns:1fr}
  .tl-key{display:none}
}
@media (max-width:560px){
  /* phone: one scrolling row per bar so the views keep most of the height */
  .shell{gap:5px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .hdr{padding:6px 8px;gap:6px}.hdr h1{font-size:18px}.hdr h1 span{display:none}
  .views button{padding:7px 9px}
  .actions .btn{padding:6px 8px}.actions #aboutBtn .long{display:none}
  .wx{gap:6px}.clock{font-size:18px}#compass{width:28px;height:28px}.wxv{display:none}
  .casebar{padding:5px 6px}
  #blurb{display:none}
  #cases{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#cases button{flex:none}
  .stats{display:none}
  .timeline{gap:6px;padding:6px 8px}
  .timeline .btn{padding:6px 8px}
  .timeline label[for],.timeline label.btn:first-of-type{display:none}
  .track{flex-basis:100%;order:5;height:40px}#strip{height:22px}
  #mcuBar{flex-wrap:nowrap;overflow-x:auto;padding:6px 8px}#mcuBar label{flex:none}
  #mcuView{height:66%}
  #tour{padding:8px 10px}#tour p{font-size:12.5px;margin-bottom:6px}#tour h3{font-size:15px}
}
</style>

<div id="stage"><div id="loading">Building the map…</div></div>
<div class="shell">
  <header class="panel hdr">
    <h1>PolSo array <span>· 2 × 2 km</span></h1>
    <div class="views" role="tablist" aria-label="View">
      <button id="vMap" role="tab" aria-selected="true">3D map</button><button id="vDev" role="tab" aria-selected="false">Devices</button><button id="vMcu" role="tab" aria-selected="false">STM32</button><button id="vBuild" role="tab" aria-selected="false">Build</button>
    </div>
    <div class="actions"><button class="btn" id="tourBtn">Guided tour</button><button class="btn" id="aboutBtn">About<span class="long"> &amp; accuracy</span></button></div>
    <div class="wx">
      <div class="clock" id="clock">--:--</div>
      <canvas id="compass" width="128" height="128" aria-label="Wind direction"></canvas>
      <div class="wxv"><span class="val" id="trh"></span><span class="val" id="wind"></span></div>
    </div>
  </header>
  <div class="panel casebar">
    <nav id="cases" role="tablist" aria-label="Simulation case"></nav>
    <p id="blurb"></p>
  </div>
  <main class="main">
    <div class="panel legend" id="legend"></div>
    <div class="side" id="mapSide">
      <div class="panel stats">
        <div><b id="sAcc">–</b><span class="lbl">Correct when answering</span></div>
        <div><b id="sCov">–</b><span class="lbl">Answered</span></div>
        <div><b id="sNow">–</b><span class="lbl">Correct right now</span></div>
        <div><b id="sFault">–</b><span class="lbl">Devices in fault</span></div>
      </div>
      <aside class="panel" id="panel" hidden aria-live="polite"></aside>
    </div>
    <section id="devView" hidden aria-label="Devices">
      <nav class="panel" id="devTabs" role="tablist" aria-label="Device" aria-orientation="vertical"></nav>
      <div class="panel" id="devDetail" role="tabpanel"></div>
    </section>
    <section id="mcuView" hidden aria-label="STM32 board">
      <div class="panel" id="mcuBar">
        <label>Device <select id="mcuDev"></select></label>
        <label>Firmware <select id="mcuArchSel"><option value="A4" selected>Optimised (tickless, DMA)</option><option value="A0">Starter (HAL, 1 ms tick)</option></select></label>
        <label>Board speed <select id="mcuRateSel"><option value="1">real time</option><option value="0.1" selected>1/10 slow motion</option><option value="0.01">1/100 slow motion</option></select></label>
      </div>
      <aside class="panel" id="mcuPanel"></aside>
    </section>
    <section id="buildView" hidden aria-label="Build guide">
      <nav class="panel" id="buildNav" aria-label="Build guide sections"></nav>
      <article class="panel" id="buildDoc"></article>
    </section>
  </main>
  <div class="panel" id="tour" hidden></div>
  <footer class="panel timeline">
    <button class="btn primary" id="play">Play</button>
    <select id="speed" aria-label="Playback speed">
      <option value="120">120×</option><option value="300" selected>300×</option><option value="900">900×</option>
    </select>
    <label class="btn"><input type="checkbox" id="truthRing" checked> Truth rings</label>
    <label class="btn" title="Show the 10-minute dominant source instead of the instant label"><input type="checkbox" id="mode10" checked> 10-min source</label>
    <div class="track">
      <canvas id="strip" aria-label="Array outcome over time; click to jump"></canvas>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time">
    </div>
    <div class="tl-key"><span><i style="background:var(--good)"></i>correct</span><span><i style="background:var(--bad)"></i>wrong</span>
      <span><i style="background:var(--neutral)"></i>uncertain</span><span><i style="background:var(--off)"></i>fault</span></div>
  </footer>
</div>
<div id="about" hidden><div class="box" id="aboutBox" role="dialog" aria-label="About this simulation"></div></div>
<div class="panel" id="tip" hidden></div>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.AREA;
const CLS = D.classes;
const COLOR = {vehicle_exhaust:'#2a78d6', biomass_burning:'#eb6834', dust:'#eda100', industrial:'#4a3aa7',
  background:'#1baf7a', uncertain:'#b4b3ad', sensor_fault:'#3b3a37', warming_up:'#e2e1db', mixed:'#c9c8c2', confounder:'#e87ba4'};
const NICE = {vehicle_exhaust:'Vehicle exhaust', biomass_burning:'Biomass burning', dust:'Dust', industrial:'Industrial',
  background:'Background air', uncertain:'Uncertain', sensor_fault:'Sensor fault', warming_up:'Warming up',
  mixed:'Mixed sources', confounder:'Other (cooking etc.)'};
const ANSWER = new Set([0,1,2,3,4]);

function spawn(si, wvx, wvy) {

    const L = Math.hypot(wvx, wvy) || 1, ux = wvx / L, uy = wvy / L, off = (rnd() - .5) * 2200;

function drawStrip() {
  const cv = $('strip'), r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio, 2);
  cv.width = Math.max(1, r.width * dpr); cv.height = r.height * dpr;
  const g = cv.getContext('2d'), n = nSteps(), bw = cv.width / n, H = cv.height;
  const col = {good: '#2e8540', bad: '#c62f2f', unc: '#b4b3ad', off: '#55544f'};
  g.fillStyle = '#eceee9'; g.fillRect(0, 0, cv.width, H);
  for (let s = 0; s < n; s++) {
    const cnt = {good: 0, bad: 0, unc: 0, off: 0};
    C.devices.forEach(dv => { const o = outcome(dv, s); if (o in cnt) cnt[o]++; });
    let y = H;
    for (const k of ['good', 'unc', 'off', 'bad']) { const h = cnt[k] / C.devices.length * H; g.fillStyle = col[k]; g.fillRect(s * bw, y - h, Math.ceil(bw), h); y -= h; }
  }
}
function stats(s) {
  let ans = 0, good = 0, clear = 0, nowGood = 0, nowClear = 0, faults = 0;
  C.devices.forEach(dv => {
    for (let k = 0; k <= s; k++) { const o = outcome(dv, k); if (o === 'na' || o === 'off') continue; clear++; if (o !== 'unc') { ans++; if (o === 'good') good++; } }
    const o = outcome(dv, s); if (o === 'off' && dv.pred[s] === 6) faults++;
    if (o === 'good' || o === 'bad' || o === 'unc') { nowClear++; if (o === 'good') nowGood++; }
  });
  $('sAcc').textContent = ans ? Math.round(100 * good / ans) + '%' : '–';
  $('sCov').textContent = clear ? Math.round(100 * ans / clear) + '%' : '–';
  $('sNow').textContent = nowClear ? `${nowGood}/${nowClear}` : '–';
  $('sFault').textContent = String(faults);
}
function drawCompass(dir, u) {

  const a = (dir + 180) * Math.PI / 180, L = 22 + Math.min(u, 7) * 4;   // arrow points where the air goes

}

  if (mb.length >= 2) { const n = mb.length; mb[n - 2].style.width = (100 * M32.memory.flash_total[1] / M32.memory.flash_cap) + '%'; mb[n - 1].style.width = (100 * M32.memory.ram_total[1] / M32.memory.ram_cap) + '%'; }
}
function drawMcuCanvases() {

  const sz = cv => { const h0 = Number(cv.dataset.h || cv.getAttribute('height')); cv.dataset.h = h0; cv.style.height = h0 + 'px';
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio, 2); cv.width = Math.max(1, r.width * dpr); cv.height = h0 * dpr;
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, r.width, h0]; };

  g.strokeStyle = '#2a78d6'; g.lineWidth = 1.4; g.stroke();
  g.fillStyle = '#56605b'; g.font = '10px IBM Plex Mono, monospace'; g.fillText(`current, last ${span} s of MCU time (${fmt(maxI, 0)} mA top)`, 6, 11);
  [g, w, h] = sz(la);

      if (key === 'cpu' ? !isCpu : !(bus && bus[0] === key)) continue;
      if (b < sec || a >= sec + 1) continue;
      const x0 = 62 + (w - 66) * (Math.max(a, sec) - sec), x1 = 62 + (w - 66) * (Math.min(b, sec + 1) - sec);

}

// ---------------------------------------------------------------- per-frame update
let mcuPrevT = 0;
function mcuFrame(dt, now, s) {
  if (!M32) { renderer.render(mScene, mCam); return; }
  const prev = mcuT;
  mcuT = ((mcuT + dt * mcuRate) % 30 + 30) % 30;
  const wrapped = mcuT < prev;
  // events that started since the last frame become packets
  for (const [lane, a] of M32.archs[mcuArch].events) {
    const bus = BUS_OF[lane];
    if (!bus) continue;
    const started = wrapped ? (a >= prev || a < mcuT) : (a >= prev && a < mcuT);
    if (started) sendPacket(bus[0], bus[1]);
  }
  if (Math.floor(prev) !== Math.floor(mcuT)) sendPacket('pwr', 1);
  // packets advance in wall time so they stay visible
  for (let i = 0; i < PK; i++) {
    const p = pkState[i];
    if (!p.wire || p.t > 1) { tmp.position.set(0, -50, 0); tmp.scale.setScalar(.001); }
    else { p.t += dt / 0.55; const u = p.dir > 0 ? p.t : 1 - p.t; tmp.position.copy(wireCurves[p.wire].getPoint(Math.min(1, Math.max(0, u)))); tmp.scale.setScalar(1); }
    tmp.updateMatrix(); pkMesh.setMatrixAt(i, tmp.matrix);
  }
  pkMesh.instanceMatrix.needsUpdate = true; if (pkMesh.instanceColor) pkMesh.instanceColor.needsUpdate = true;
  // chip, LEDs, fan, heater
  const st = stateAt(mcuT);
  const sysTickFlicker = M32.archs[mcuArch].tick === 'hal1k' && st === 1 && Math.sin(now / 9) > .6;
  mcuChip.material.emissive.set(sysTickFlicker ? STATE_COL[0] : STATE_COL[st]);
  mcuChip.material.emissiveIntensity = st === 0 || sysTickFlicker ? .9 : st === 1 ? .35 : .04;
  const sinceWin = ((mcuT - 29.95) % 30 + 30) % 30;
  ld2.material.emissiveIntensity = sinceWin < 0.5 * mcuRate ? 1.2 : 0;
  sdLed.material.emissiveIntensity = M32.archs[mcuArch].events.some(e => (e[0] === 'SD SPI+DMA' || e[0] === 'SD busy-wait' || e[0] === 'FatFs CPU') && mcuT >= e[1] && mcuT < e[1] + 0.4 * mcuRate) ? 1.2 : 0;
  gpsLed.material.emissiveIntensity = (mcuT % 1) < 0.12 ? 1 : 0;
  fan.rotation.y += dt * 40;
  const hs = M32.heater[Math.floor(mcuT) % 10], hc = new THREE.Color().setHSL(0.13 - 0.13 * (hs - 150) / 250, 1, .5);
  heater.material.emissive.copy(hc); heater.material.emissiveIntensity = .9;
  // battery level
  const sysA0 = M32.levers[0][1], sysMa = mcuArch === 'A0' ? sysA0 : sysA0 - M32.archs.A0.avg_ma[1] + M32.archs.A4.avg_ma[1];
  const left = Math.max(0, 1 - sysMa * tSim / 3600 / 1700);
  battLevel.scale.x = Math.max(.02, left); battLevel.position.x = -5 - 30 * (1 - left);
  battLevel.material.color.setHSL(0.33 * left, .7, .45);
  mCtl.update();
  renderer.render(mScene, mCam);
  const place2 = (el, pos) => { proj.copy(pos).project(mCam); if (proj.z > 1) { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.left = ((proj.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - proj.y) / 2 * innerHeight) + 'px'; };
  mTags.forEach(t => place2(t.el, t.pos)); wireTags.forEach(t => place2(t.el, t.pos));
  if (now - mcuLastPanel > 250) { mcuLastPanel = now; mcuPanel(s); }
  drawMcuCanvases();
}
$('mcuArchSel').onchange = e => { mcuArch = e.target.value; mcuLastPanel = 0; };
$('mcuRateSel').onchange = e => { mcuRate = Number(e.target.value); mcuLastPanel = 0; };
$('mcuDev').onchange = e => { devSel = Number(e.target.value); mcuEnter(); };

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(devs.map(v => v.hit))[0];
  return hit ? hit.object.userData.k : null;
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (viewMode !== 'map') return;
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const k = pick(e); selected = k; $('panel').hidden = k === null; lastPanel = -1;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (viewMode !== 'map') return;
  const k = pick(e), tip = $('tip');

  const s = stepAt(tSim), dv = C.devices[k];
  tip.innerHTML = `<b>${devs[k].d.id}</b> reports <b>${NICE[CLS[shownLabel(dv, s)]]}</b> (${dv.conf[s]}%)<br>Really: ${NICE[CLS[shownTruth(dv, s)]]}<br>PM2.5 ${pmText(dv, s)} · true ${dv.pm_true[s]} µg/m³<br><span class="src">Click for details</span>`;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; tip.hidden = false;
});

// ---------------------------------------------------------------- Build tab: how to construct the real device
// Content comes from build_spec.py (results/build_params.json), which reads params.py, spec.py and the firmware headers,
// so every number here is the one the simulation used. Memory and power-lever rows come live from the STM32 run (D.stm32).
let buildDone = false;
const escH = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function copyText(txt, btn) {
  const done = ok => { if (btn) { const o = btn.textContent; btn.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => btn.textContent = o, 1400); } };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); done(ok); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => done(true), fallback); else fallback();
}
function buildSections() {
  const B = D.build, S = B.sections.map(s => ({...s}));
  if (M32) {
    const kb = b => (b / 1024).toFixed(1) + ' KB';
    const mem = [...M32.memory.flash.map(([n, b]) => ['Flash · ' + n, kb(b), '', 'EST']), ...M32.memory.ram.map(([n, b]) => ['SRAM · ' + n, kb(b), '', 'EST']),
      ['Flash total', kb(M32.memory.flash_total[1]), `of ${M32.memory.flash_cap / 1024} KB (range ${kb(M32.memory.flash_total[0])}–${kb(M32.memory.flash_total[2])})`, 'EST'],
      ['SRAM total', kb(M32.memory.ram_total[1]), `of ${M32.memory.ram_cap / 1024} KB (range ${kb(M32.memory.ram_total[0])}–${kb(M32.memory.ram_total[2])})`, 'EST']];
    const lev = M32.levers.map(([n, ma, h]) => [n, ma.toFixed(1) + ' mA', `battery life ≈ ${h >= 48 ? (h / 24).toFixed(1) + ' days' : h.toFixed(0) + ' h'} (whole system)`, 'EST']);
    const i = S.findIndex(s => s.id === 'power') + 1;
    S.splice(i, 0, {id: 'mem', title: '8b · Memory map and battery life', intro: 'From the STM32 run (python run_mcu.py). Each design lever is applied on top of the previous one; the last row is the full optimised design.',
      cols: ['Item', 'Value', 'Notes', 'Tag'], rows: [...mem, ...lev], steps: []});
  }

}
function sectionText(s) {
  let o = `## ${s.title}\n\n${s.intro}\n\n`;
  if (s.rows.length) o += '| ' + s.cols.join(' | ') + ' |\n|' + s.cols.map(() => '---|').join('') + '\n' + s.rows.map(r => '| ' + r.join(' | ') + ' |').join('\n') + '\n\n';
  s.steps.forEach((x, k) => o += `${k + 1}. ${x}\n`);
  return o;
}
function buildEnter() {
  if (buildDone) return;
  const doc = $('buildDoc');
  if (!D.build) { doc.innerHTML = '<p>The build sheet is missing. Run <code>python viewer/build_viewer.py</code> to regenerate it.</p>'; return; }
  buildDone = true;
  const B = D.build, S = buildSections();
  const tag = x => `<span class="t-${x}" title="${escH(B.tags[x] || '')}">${x}</span>`;
  $('buildNav').innerHTML = S.map(s => `<a href="#b-${s.id}" data-s="${s.id}">${escH(s.title)}</a>`).join('');
  doc.innerHTML = `<p><b>Everything needed to build the real PolSo device from this repo.</b> Generated by <code>build_spec.py</code> from the files the simulation ran on, and also saved as <code>BUILD_GUIDE.md</code> at the repo root.
    Tags: ${Object.keys(B.tags).map(k => tag(k) + ' ' + escH(B.tags[k])).join(' · ')}.</p>

    S.map(s => `<section><h2 id="b-${s.id}">${escH(s.title)}</h2><p>${escH(s.intro)}</p>
      ${s.rows.length ? `<div class="scroll"><table><thead><tr>${s.cols.map(c => `<th>${escH(c)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r =>
        `<tr>${r.map((c, k) => k === r.length - 1 && s.cols[k] === 'Tag' ? `<td>${tag(c)}</td>` : `<td>${escH(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
      ${s.steps.length ? `<ol>${s.steps.map(x => `<li>${escH(x)}</li>`).join('')}</ol>` : ''}
      <div class="copyrow"><button class="btn" data-copy="${s.id}">Copy this section</button></div></section>`).join('');
  $('bCopyAll').onclick = e => copyText('# PolSo build guide\n\n' + S.map(sectionText).join('\n'), e.currentTarget);
  doc.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(sectionText(S.find(s => s.id === b.dataset.copy)), b));
  $('buildNav').onclick = e => {
    const a = e.target.closest('a'); if (!a) return; e.preventDefault();

// ---------------------------------------------------------------- loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  mCam.aspect = w / h;
  // narrow screens: the STM32 panel is a bottom sheet, so centre the board and lift it into the free top part
  const narrow = innerWidth <= 900, mcuFit = narrow ? 'n' : 'w';
  if (mcuFit !== resize.mcuFit) {
    resize.mcuFit = mcuFit;
    if (narrow) { mCtl.target.set(0, 0, 18); mCam.position.set(0, innerWidth < 560 ? 420 : 300, innerWidth < 560 ? 470 : 330); } else { mCtl.target.set(42, 0, 18); mCam.position.set(10, 235, 260); }
  }
  if (narrow) {                             // centre the board in the space between the case bar and the bottom sheet
    const m = document.querySelector('.main').getBoundingClientRect(), sheet = innerWidth <= 560 ? 0.66 : 0.58;
    const freeMid = (m.top + m.bottom - sheet * m.height) / 2;
    mCam.setViewOffset(w, h, 0, h / 2 - freeMid, w, h);
  } else mCam.clearViewOffset();
  mCam.updateProjectionMatrix();
  if (C) { drawStrip(); layoutDev(); devDrawnFor = ''; lastStep = -1; }
}
addEventListener('resize', resize);
let last = performance.now(), lastStep = -1, lastPanel = -1;
const proj = new THREE.Vector3();
function place(el, pos) {
  proj.copy(pos).project(camera);
  if (proj.z > 1) { el.style.display = 'none'; return; }
  el.style.display = ''; el.style.left = ((proj.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - proj.y) / 2 * innerHeight) + 'px';
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (playing) { tSim += dt * Number($('speed').value); if (tSim >= caseDur()) tSim = 0; }
  const s = stepAt(tSim), w = weatherAt(tSim);
  $('scrub').value = Math.round(tSim / caseDur() * 1000);
  $('clock').textContent = hhmm(tSim);
  $('trh').textContent = `${w.temp.toFixed(1)} °C · ${Math.round(w.rh)} %`;
  $('wind').textContent = `${w.u.toFixed(1)} m/s from ${compassName(w.dir)}`;
  drawCompass(w.dir, w.u);

  if (devMode) {
    if (s !== lastStep) { lastStep = s; stats(s); renderDev(s); }
    requestAnimationFrame(frame); return;
  }
  if (buildMode) {                          // build guide is static text: no 3D work
    if (s !== lastStep) { lastStep = s; stats(s); }
    requestAnimationFrame(frame); return;
  }
  if (mcuMode) {
    if (s !== lastStep) { lastStep = s; stats(s); }
    mcuFrame(dt, now, s);
    requestAnimationFrame(frame); return;
  }
  if (s !== lastStep) {
    lastStep = s; stats(s);
    let pmSum = 0;
    devs.forEach((v, k) => {
      const dv = C.devices[k], p = CLS[shownLabel(dv, s)], t = CLS[shownTruth(dv, s)], o = outcome(dv, s);
      v.beaconMat.color.set(COLOR[p]); v.beaconMat.emissive.set(COLOR[p]);
      v.ringMat.color.set(COLOR[t]);
      v.tag.innerHTML = `${v.d.id} ${o === 'good' ? '<span class="ok">✓</span>' : o === 'bad' ? '<span class="no">✗</span>' : o === 'unc' ? '?' : o === 'off' ? '⚠' : ''}`;
      pmSum += dv.pm_true[s];
    });
    // haze tint follows the mean true PM2.5 across the array; fog cases whiten and close in
    const pm = pmSum / devs.length, fogF = Math.max(0, (w.rh - 88) / 10);
    const c = BG.clone().lerp(HAZE, Math.min(1, pm / 320)).lerp(FOG, Math.min(1, fogF));
    scene.background.copy(c); scene.fog.color.copy(c);
    scene.fog.near = 2600 - Math.min(1, pm / 300) * 1500 - fogF * 900; scene.fog.far = 6500 - Math.min(1, pm / 300) * 2500 - fogF * 2600;
  }
  if (selected !== null && lastPanel !== s) { lastPanel = s; renderPanel(s); }
  // faulty devices blink
  devs.forEach((v, k) => { if (C.devices[k].pred[s] === 6) v.beaconMat.emissiveIntensity = .2 + .5 * (Math.sin(now / 180) > 0); else v.beaconMat.emissiveIntensity = .55; });

  // plumes
  const dirTo = (w.dir + 180) * Math.PI / 180, VIS = 22, wvx = Math.sin(dirTo) * w.u * VIS, wvy = Math.cos(dirTo) * w.u * VIS;
  const fx = Math.max(0, (tSim - (W - 1)) / HOP), i0 = Math.min(Math.floor(fx), nSteps() - 1);
  if (playing || true) SRC.forEach((src, si) => {
    const a = C.activity[src.id]; if (!a) return;
    const act = a[i0] || 0, rate = (src.regional ? 160 : 1.6 * Math.sqrt(src.q)) * act * (reduceMotion ? .3 : 1);
    spawnAcc[si] += rate * dt; while (spawnAcc[si] >= 1) { spawn(si, wvx, wvy); spawnAcc[si] -= 1; }
  });
  for (let i = 0; i < NP; i++) {

    pSize[i] += pGrow[i] * dt * 3;
    pAlpha[i] = pMaxA[i] * Math.min(1, f * 6) * (1 - f);

  }
  pGeo.attributes.position.needsUpdate = pGeo.attributes.aSize.needsUpdate = pGeo.attributes.aAlpha.needsUpdate = pGeo.attributes.color.needsUpdate = true;

  // traffic
  const traffic = Math.max(.15, ((C.activity.highway_diesel || [1])[i0] || .5));
  carState.forEach((c, i) => {
    c.s += c.dir * c.v * 60 * dt * Math.min(2, traffic); if (c.s > 1000) c.s = -1000; if (c.s < -1000) c.s = 1000;
    if (c.road === 0) { tmp.position.copy(V(c.s, -450 + c.dir * 7, 1.9)); tmp.rotation.y = 0; }
    else { tmp.position.copy(V(150 + c.dir * 5, c.s, 1.9)); tmp.rotation.y = Math.PI / 2; }
    tmp.scale.setScalar(1); tmp.updateMatrix(); cars.setMatrixAt(i, tmp.matrix);
  });
  cars.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  devs.forEach(v => place(v.tag, v.g.position.clone().setY(40)));
  srcTags.forEach(t => place(t.el, t.pos));

}

let startIdx = 0;
try { const k = D.cases.findIndex(c => c.id === localStorage.getItem('polso-case')); if (k >= 0) startIdx = k; } catch (e) {}
buildDevTabs();
resize(); loadCase(startIdx);
try { const v0 = localStorage.getItem('polso-view'); if (v0 === 'dev' || v0 === 'mcu' || v0 === 'build') setView(v0); else setView('map'); } catch (e) {}
$('play').textContent = playing ? 'Pause' : 'Play';
requestAnimationFrame(frame);
// test hook: drive one frame by hand (used for automated checks when the page is not being painted)
